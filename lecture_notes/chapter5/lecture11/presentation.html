<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --done: #16a34a;
    --border: #d8dce3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  .question-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .q-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .q-btn:hover { border-color: var(--accent); }
  .q-btn.active { border-color: var(--accent); background: #eaf1ff; }
  .q-btn.done { border-color: var(--done); }
  .q-btn .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: transparent;
    flex-shrink: 0;
  }
  .q-btn.done .check {
    background: var(--done);
    border-color: var(--done);
    color: white;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 30px 60px;
  }
  .stage {
    max-width: 1000px;
    width: 100%;
  }
  .placeholder {
    text-align: center;
    font-size: 1.6rem;
    color: #888;
    margin-top: 80px;
  }
  .question-block {
    font-size: 2.1rem;
    font-weight: 700;
    line-height: 1.5;
    text-align: left;
  }
  .question-block p { margin: 0 0 0.7em; }
  .question-block ul { margin: 0.5em 0 0.9em 1.4em; }
  .question-block li { margin-bottom: 0.3em; }
  .question-block pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 18px 22px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.2rem;
    font-weight: 400;
  }
  .question-block code {
    background: #e8eaf0;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.85em;
    font-weight: 400;
  }
  .question-block pre code { background: none; padding: 0; }
  .controls {
    display: flex;
    gap: 14px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  button.action {
    font-size: 1.15rem;
    padding: 14px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-answer {
    background: var(--accent);
    color: white;
  }
  .btn-answer:hover { background: var(--accent-dark); }
  .btn-answer.showing { background: #4b5563; }
  .btn-done {
    background: var(--panel);
    border: 2px solid var(--done);
    color: var(--done);
  }
  .btn-done.active {
    background: var(--done);
    color: white;
  }
  .answer-panel {
    display: none;
    margin-top: 10px;
    padding: 26px 30px;
    background: #fffbe6;
    border: 2px solid #f2d675;
    border-radius: 12px;
    font-size: 1.5rem;
    line-height: 1.5;
  }
  .answer-panel.visible { display: block; }
  .answer-panel h2 {
    margin-top: 0;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #92700f;
  }
  .answer-panel pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 16px 20px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.15rem;
  }
  .answer-panel code {
    background: #eee0b0;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .answer-panel pre code { background: none; padding: 0; }
  .no-answer {
    font-style: italic;
    color: #888;
  }
  .file-tag {
    font-size: 0.85rem;
    color: #999;
    margin-top: -18px;
    margin-bottom: 20px;
  }
  sup, sub { font-size: 0.7em; }
</style>

<script type="text/plain" class="qfile" data-id="q1" data-file="q1_sol.py" data-label="Q1">
## Question

Make fortune cookie program that, when run, randomly prints one of these
phrases:

- Whatever you do, always give 100% —- unless you're donating blood.
- Be a cupcake in a world full of muffins.
- We become what we think about: so don't think too much about hot dogs.
- You can’t have everything. Where would you put it?

Sample run 1
```
Be a cupcake in a world full of muffins.
```

Sample run 2
```
You can't have everything. Where would you put it?
```

Sample run 3
```
Be a cupcake in a world full of muffins.
```

Since the program chooses the quote randomly, there will be repeats across
different runs.

## Sample Solution

```python
import random

n = random.randint(1, 4)
if n == 1:
    print("Whatever you do, always give 100%—unless you're donating blood.")
elif n == 2:
    print("Be a cupcake in a world full of muffins.")
elif n == 3:
    print("We become what we think about: so don't think too much about hot dogs.")
elif n == 4:
    print("You can't have everything. Where would you put it?")
```
</script>

<script type="text/plain" class="qfile" data-id="q2" data-file="q2_sol.py" data-label="Q2">
## Question

Write a program that asks the user to enter the side-length of a perfectly
square field, and then prints the area and the perimeter of the field.

However, you must do it by creating and using two functions: one that calculates
are (given the side length), and one that calculates the perimeter (given the
side length). Each of these functions should return (not print!) their result.

Use these functions in a sensible way in your program.

```
How long is the field? 6
The area is 36. 
The perimeter is 24.
```

## Sample Solution

```python
def area(size):
    return size * size

def perimeter(size):
    return 4 * size

size = int(input("How long is the field? "))
area = area(size)
perimeter = perimeter(size)
print(f"The area is {area}.")
print(f"The perimeter is {perimeter}.")
```
</script>

<script type="text/plain" class="qfile" data-id="q4" data-file="q4_sol.py" data-label="Q4">
## Question

During the summer, a neighborhood has these rules for lawn watering:

- houses with even street numbers may water their lawn only on even-numbered
  days
  
- houses with odd street numbers may water their lawn only on odd-numbered days

Write a program that asks the user to enter a street number (like 503 or
1944) and a day number (Monday is 1, Tuesday is 2, ..., Sunday is 7), and then
prints whether or not that house may water their lawn that day.

As an extra challenge, write and use a function called `can_water(street_number,
day)` that returns `True` if the house may water their lawn that day, and `False`
otherwise.

Sample run 1
```
Enter a street number: 503
Enter a day number: 1
You can water your lawn today.
```

Sample run 2
```
Enter a street number: 1944
Enter a day number: 2
You can water your lawn today.
```

Sample run 3
```
Enter a street number: 1944
Enter a day number: 3
You cannot water your lawn today.
```

## Sample Solution

```python
def can_water(street_number, day):
    if street_number % 2 == 0:
        return day % 2 == 0
    else:
        return day % 2 != 0

street_number = int(input("Enter a street number: "))
day = int(input("Enter a day number: "))
if can_water(street_number, day):
    print("You can water your lawn today.")
else:
    print("You cannot water your lawn today.")
```
</script>

<script>
function splitSections(text) {
  text = (text || '').replace(/\r\n/g, '\n');
  const qMatch = text.match(/##\s*Question\s*\n([\s\S]*?)(?=\n##\s*Sample Solution|$)/);
  const sMatch = text.match(/##\s*Sample Solution\s*\n([\s\S]*)/);
  const question = qMatch ? qMatch[1].trim() : text.trim();
  const solution = sMatch ? sMatch[1].trim() : '';
  return { question: question, solution: solution };
}

function loadQuestionsFromPage() {
  const blocks = document.querySelectorAll('script.qfile');
  const loaded = [];
  blocks.forEach(function(block) {
    const sections = splitSections(block.textContent);
    loaded.push({
      id: block.dataset.id,
      file: block.dataset.file,
      label: block.dataset.label,
      question: sections.question,
      solution: sections.solution
    });
  });
  return loaded;
}

const QUESTIONS = loadQuestionsFromPage();

const DONE_KEY = 'presentationAI_done_presentation';
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function saveDone(set) {
  try {
    localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}
let doneSet = loadDone();
let currentId = null;
let answerShown = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInlineMarkup(text) {
  text = text.replace(/\$([^$]+)\$/g, function(_, inner) {
    let out = inner;
    out = out.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
    out = out.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
    return out;
  });
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return text;
}

function renderMarkdownLite(md) {
  md = (md || '').replace(/\r\n/g, '\n').trim();
  if (!md) return '';
  const fenceRegex = /```([a-zA-Z0-9]*)\n([\s\S]*?)```/g;
  const codeBlocks = [];
  const placeholderText = md.replace(fenceRegex, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push(escapeHtml(code.replace(/\n$/, '')));
    // blank lines around the placeholder so a code block always stands on
    // its own, even if the question has no blank line before or after it
    return '\n\n@@CODEBLOCK' + idx + '@@\n\n';
  });
  const blocks = placeholderText.split(/\n\s*\n/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const codeMatch = trimmed.match(/^@@CODEBLOCK(\d+)@@$/);
    if (codeMatch) {
      html += '<pre><code>' + codeBlocks[parseInt(codeMatch[1], 10)] + '</code></pre>';
      continue;
    }
    const lines = trimmed.split('\n');
    if (/^\s*-\s+/.test(lines[0])) {
      // Group lines into bullet items: a line starting with "- " begins a
      // new item; any other line (e.g. an indented wrapped continuation of
      // the previous item's text) is appended to the current item instead
      // of being mistaken for a non-list paragraph.
      const items = [];
      lines.forEach(function(l) {
        const m = l.match(/^\s*-\s+(.*)/);
        if (m) {
          items.push(m[1]);
        } else if (items.length) {
          items[items.length - 1] += ' ' + l.trim();
        } else {
          items.push(l.trim());
        }
      });
      html += '<ul>' + items.map(function(item) {
        return '<li>' + renderInlineMarkup(escapeHtml(item)) + '</li>';
      }).join('') + '</ul>';
    } else {
      const joined = trimmed.replace(/\n/g, ' ');
      html += '<p>' + renderInlineMarkup(escapeHtml(joined)) + '</p>';
    }
  }
  return html;
}

function buildNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  QUESTIONS.forEach(function(q) {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (doneSet.has(q.id) ? ' done' : '') + (q.id === currentId ? ' active' : '');
    btn.type = 'button';
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.title = 'Toggle done';
    check.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(q.id);
    });
    const label = document.createElement('span');
    label.textContent = q.label;
    btn.appendChild(check);
    btn.appendChild(label);
    btn.addEventListener('click', function() {
      showQuestion(q.id);
    });
    nav.appendChild(btn);
  });
}

function toggleDone(id) {
  if (doneSet.has(id)) {
    doneSet.delete(id);
  } else {
    doneSet.add(id);
  }
  saveDone(doneSet);
  buildNav();
  if (id === currentId) renderStage();
}

function showQuestion(id) {
  currentId = id;
  answerShown = false;
  buildNav();
  renderStage();
}

function renderStage() {
  const stage = document.getElementById('stage');
  const q = QUESTIONS.find(function(x) { return x.id === currentId; });
  if (!q) {
    stage.innerHTML = '<div class="placeholder">Select a question above to display it.</div>';
    return;
  }
  const isDone = doneSet.has(q.id);
  const hasSolution = q.solution && q.solution.trim().length > 0;
  let html = '';
  html += '<div class="file-tag">' + q.file + '</div>';
  html += '<div class="question-block">' + renderMarkdownLite(q.question) + '</div>';
  html += '<div class="controls">';
  html += '<button type="button" class="action btn-answer' + (answerShown ? ' showing' : '') + '" id="answerToggle">' + (answerShown ? 'Hide Answer' : 'Show Answer') + '</button>';
  html += '<button type="button" class="action btn-done' + (isDone ? ' active' : '') + '" id="doneToggle">' + (isDone ? '✓ Marked Done' : 'Mark as Done') + '</button>';
  html += '</div>';
  html += '<div class="answer-panel' + (answerShown ? ' visible' : '') + '" id="answerPanel">';
  html += '<h2>Sample Solution</h2>';
  html += hasSolution ? renderMarkdownLite(q.solution) : '<p class="no-answer">No sample solution provided for this question.</p>';
  html += '</div>';
  stage.innerHTML = html;

  document.getElementById('answerToggle').addEventListener('click', function() {
    answerShown = !answerShown;
    renderStage();
  });
  document.getElementById('doneToggle').addEventListener('click', function() {
    toggleDone(q.id);
  });
}

if (QUESTIONS.length === 0) {
  document.getElementById('stage').innerHTML = '<div class="placeholder">No question blocks found in this page.</div>';
} else {
  buildNav();
  renderStage();
}
</script>
</body>
