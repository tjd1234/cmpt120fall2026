<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Questions</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --done: #16a34a;
    --border: #d8dce3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  .question-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .q-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .q-btn:hover { border-color: var(--accent); }
  .q-btn.active { border-color: var(--accent); background: #eaf1ff; }
  .q-btn.done { border-color: var(--done); }
  .q-btn .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: transparent;
    flex-shrink: 0;
  }
  .q-btn.done .check {
    background: var(--done);
    border-color: var(--done);
    color: white;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 30px 60px;
  }
  .stage {
    max-width: 1000px;
    width: 100%;
  }
  .placeholder {
    text-align: center;
    font-size: 1.6rem;
    color: #888;
    margin-top: 80px;
  }
  .question-block {
    font-size: 2.1rem;
    font-weight: 700;
    line-height: 1.5;
    text-align: left;
  }
  .question-block p { margin: 0 0 0.7em; }
  .question-block ul { margin: 0.5em 0 0.9em 1.4em; }
  .question-block li { margin-bottom: 0.3em; }
  .question-block pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 18px 22px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.2rem;
    font-weight: 400;
  }
  .question-block code {
    background: #e8eaf0;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.85em;
    font-weight: 400;
  }
  .question-block pre code { background: none; padding: 0; }
  .controls {
    display: flex;
    gap: 14px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  button.action {
    font-size: 1.15rem;
    padding: 14px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-answer {
    background: var(--accent);
    color: white;
  }
  .btn-answer:hover { background: var(--accent-dark); }
  .btn-answer.showing { background: #4b5563; }
  .btn-done {
    background: var(--panel);
    border: 2px solid var(--done);
    color: var(--done);
  }
  .btn-done.active {
    background: var(--done);
    color: white;
  }
  .answer-panel {
    display: none;
    margin-top: 10px;
    padding: 26px 30px;
    background: #fffbe6;
    border: 2px solid #f2d675;
    border-radius: 12px;
    font-size: 1.5rem;
    line-height: 1.5;
  }
  .answer-panel.visible { display: block; }
  .answer-panel h2 {
    margin-top: 0;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #92700f;
  }
  .answer-panel pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 16px 20px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.15rem;
  }
  .answer-panel code {
    background: #eee0b0;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .answer-panel pre code { background: none; padding: 0; }
  .no-answer {
    font-style: italic;
    color: #888;
  }
  .file-tag {
    font-size: 0.85rem;
    color: #999;
    margin-top: -18px;
    margin-bottom: 20px;
  }
  sup, sub { font-size: 0.7em; }
</style>
</head>
<body>
<header>
  <h1>Practice Questions</h1>
  <div class="question-nav" id="questionNav"></div>
</header>
<main>
  <div class="stage" id="stage">
    <div class="placeholder">Select a question above to display it.</div>
  </div>
</main>

<script type="text/plain" class="qfile" data-id="q1" data-file="q1_sol.py" data-label="Q1">
## Question

Write a program that reads a phrase from the user prints sandwiched between two
lines of dash characters as shown in the sample run:

```
Enter a phrase: Hello, world!

-------------
Hello, world!
-------------
```

## Sample Solution

```python
phrase = input('Enter a phrase: ')
line = '-' * len(phrase)
print(line)
print(phrase)
print(line)
```

<script type="text/plain" class="qfile" data-id="q2" data-file="q2_sol.py" data-label="Q2">
## Question

Write a program that reads in the lengths of the two legs of a right triangle (a
and b in the diagram)and then computes the length of the hypotenuse using the
fact that c^2 = a^2 + b^2.

```
      /|
  c  / |  a
    /  |
   /___|
     b
```

Here's a sample run:

```
What is a? 3.5
What ib b? 6

The hypotenuse c is 6.946221994724902
```

## Sample Solution

```python
import math

a = float(input('What is a? '))
b = float(input('What is b? '))
c = math.sqrt(a**2 + b**2)
print('The hypotenuse c is', c)
```
</script>

<script type="text/plain" class="qfile" data-id="q3" data-file="q3_sol.py" data-label="Q3">
## Question

Write a program that asks the user how many sides they would like their die to
have, and then rolls the die 3 times and prints the results of each roll.

```
How many die sides? 6
Rolling a 6-sided die three times ...
1st roll: 6
2nd roll: 5
3rd roll: 2
```

## Sample Solution

```python
import random

sides = int(input('How many die sides? '))
print(f'Rolling a {sides}-sided die three times ...')
print('1st roll:', random.randint(1, sides))
print('2nd roll:', random.randint(1, sides))
print('3rd roll:', random.randint(1, sides))
```
</script>

<script type="text/plain" class="qfile" data-id="q4" data-file="q4_sol.py" data-label="Q4">
## Question

Draw a square on the screen using turtle graphics. Make sure the screen does
*not* close when the program ends.

## Sample Solution

```python
import turtle

turtle.forward(200)
turtle.right(90)
turtle.forward(200)
turtle.right(90)
turtle.forward(200)
turtle.right(90)
turtle.forward(200)

turtle.done()
```
</script>

<script>
function splitSections(text) {
  text = (text || '').replace(/\r\n/g, '\n');
  const qMatch = text.match(/##\s*Question\s*\n([\s\S]*?)(?=\n##\s*Sample Solution|$)/);
  const sMatch = text.match(/##\s*Sample Solution\s*\n([\s\S]*)/);
  const question = qMatch ? qMatch[1].trim() : text.trim();
  const solution = sMatch ? sMatch[1].trim() : '';
  return { question: question, solution: solution };
}

function loadQuestionsFromPage() {
  const blocks = document.querySelectorAll('script.qfile');
  const loaded = [];
  blocks.forEach(function(block) {
    const sections = splitSections(block.textContent);
    loaded.push({
      id: block.dataset.id,
      file: block.dataset.file,
      label: block.dataset.label,
      question: sections.question,
      solution: sections.solution
    });
  });
  return loaded;
}

const QUESTIONS = loadQuestionsFromPage();

const DONE_KEY = 'presentationAI_done_presentation';
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function saveDone(set) {
  try {
    localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}
let doneSet = loadDone();
let currentId = null;
let answerShown = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInlineMarkup(text) {
  text = text.replace(/\$([^$]+)\$/g, function(_, inner) {
    let out = inner;
    out = out.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
    out = out.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
    return out;
  });
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return text;
}

function renderMarkdownLite(md) {
  md = (md || '').replace(/\r\n/g, '\n').trim();
  if (!md) return '';
  const fenceRegex = /```([a-zA-Z0-9]*)\n([\s\S]*?)```/g;
  const codeBlocks = [];
  const placeholderText = md.replace(fenceRegex, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push(escapeHtml(code.replace(/\n$/, '')));
    return '@@CODEBLOCK' + idx + '@@';
  });
  const blocks = placeholderText.split(/\n\s*\n/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const codeMatch = trimmed.match(/^@@CODEBLOCK(\d+)@@$/);
    if (codeMatch) {
      html += '<pre><code>' + codeBlocks[parseInt(codeMatch[1], 10)] + '</code></pre>';
      continue;
    }
    const lines = trimmed.split('\n');
    if (lines.every(function(l) { return /^\s*-\s+/.test(l); })) {
      html += '<ul>' + lines.map(function(l) {
        return '<li>' + renderInlineMarkup(escapeHtml(l.replace(/^\s*-\s+/, ''))) + '</li>';
      }).join('') + '</ul>';
    } else {
      const joined = trimmed.replace(/\n/g, ' ');
      html += '<p>' + renderInlineMarkup(escapeHtml(joined)) + '</p>';
    }
  }
  return html;
}

function buildNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  QUESTIONS.forEach(function(q) {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (doneSet.has(q.id) ? ' done' : '') + (q.id === currentId ? ' active' : '');
    btn.type = 'button';
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.title = 'Toggle done';
    check.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(q.id);
    });
    const label = document.createElement('span');
    label.textContent = q.label;
    btn.appendChild(check);
    btn.appendChild(label);
    btn.addEventListener('click', function() {
      showQuestion(q.id);
    });
    nav.appendChild(btn);
  });
}

function toggleDone(id) {
  if (doneSet.has(id)) {
    doneSet.delete(id);
  } else {
    doneSet.add(id);
  }
  saveDone(doneSet);
  buildNav();
  if (id === currentId) renderStage();
}

function showQuestion(id) {
  currentId = id;
  answerShown = false;
  buildNav();
  renderStage();
}

function renderStage() {
  const stage = document.getElementById('stage');
  const q = QUESTIONS.find(function(x) { return x.id === currentId; });
  if (!q) {
    stage.innerHTML = '<div class="placeholder">Select a question above to display it.</div>';
    return;
  }
  const isDone = doneSet.has(q.id);
  const hasSolution = q.solution && q.solution.trim().length > 0;
  let html = '';
  html += '<div class="file-tag">' + q.file + '</div>';
  html += '<div class="question-block">' + renderMarkdownLite(q.question) + '</div>';
  html += '<div class="controls">';
  html += '<button type="button" class="action btn-answer' + (answerShown ? ' showing' : '') + '" id="answerToggle">' + (answerShown ? 'Hide Answer' : 'Show Answer') + '</button>';
  html += '<button type="button" class="action btn-done' + (isDone ? ' active' : '') + '" id="doneToggle">' + (isDone ? '✓ Marked Done' : 'Mark as Done') + '</button>';
  html += '</div>';
  html += '<div class="answer-panel' + (answerShown ? ' visible' : '') + '" id="answerPanel">';
  html += '<h2>Sample Solution</h2>';
  html += hasSolution ? renderMarkdownLite(q.solution) : '<p class="no-answer">No sample solution provided for this question.</p>';
  html += '</div>';
  stage.innerHTML = html;

  document.getElementById('answerToggle').addEventListener('click', function() {
    answerShown = !answerShown;
    renderStage();
  });
  document.getElementById('doneToggle').addEventListener('click', function() {
    toggleDone(q.id);
  });
}

if (QUESTIONS.length === 0) {
  document.getElementById('stage').innerHTML = '<div class="placeholder">No question blocks found in this page.</div>';
} else {
  buildNav();
  renderStage();
}
</script>
</body>
