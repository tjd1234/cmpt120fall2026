<title>Practice Questions</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --done: #16a34a;
    --border: #d8dce3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 1.4rem;
    margin: 0;
  }
  .question-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .q-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 1.1rem;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--panel);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .q-btn:hover { border-color: var(--accent); }
  .q-btn.active { border-color: var(--accent); background: #eaf1ff; }
  .q-btn.done { border-color: var(--done); }
  .q-btn .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    color: transparent;
    flex-shrink: 0;
  }
  .q-btn.done .check {
    background: var(--done);
    border-color: var(--done);
    color: white;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 30px 60px;
  }
  .stage {
    max-width: 1000px;
    width: 100%;
  }
  .placeholder {
    text-align: center;
    font-size: 1.6rem;
    color: #888;
    margin-top: 80px;
  }
  .question-block {
    font-size: 2.1rem;
    font-weight: 700;
    line-height: 1.5;
    text-align: left;
  }
  .question-block p { margin: 0 0 0.7em; }
  .question-block ul { margin: 0.5em 0 0.9em 1.4em; }
  .question-block li { margin-bottom: 0.3em; }
  .question-block pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 18px 22px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.2rem;
    font-weight: 400;
  }
  .question-block code {
    background: #e8eaf0;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 0.85em;
    font-weight: 400;
  }
  .question-block pre code { background: none; padding: 0; }
  .controls {
    display: flex;
    gap: 14px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  button.action {
    font-size: 1.15rem;
    padding: 14px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-answer {
    background: var(--accent);
    color: white;
  }
  .btn-answer:hover { background: var(--accent-dark); }
  .btn-answer.showing { background: #4b5563; }
  .btn-done {
    background: var(--panel);
    border: 2px solid var(--done);
    color: var(--done);
  }
  .btn-done.active {
    background: var(--done);
    color: white;
  }
  .answer-panel {
    display: none;
    margin-top: 10px;
    padding: 26px 30px;
    background: #fffbe6;
    border: 2px solid #f2d675;
    border-radius: 12px;
    font-size: 1.5rem;
    line-height: 1.5;
  }
  .answer-panel.visible { display: block; }
  .answer-panel h2 {
    margin-top: 0;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #92700f;
  }
  .answer-panel pre {
    background: #1e1e2e;
    color: #f5f5f5;
    padding: 16px 20px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 1.15rem;
  }
  .answer-panel code {
    background: #eee0b0;
    padding: 2px 8px;
    border-radius: 5px;
  }
  .answer-panel pre code { background: none; padding: 0; }
  .no-answer {
    font-style: italic;
    color: #888;
  }
  .file-tag {
    font-size: 0.85rem;
    color: #999;
    margin-top: -18px;
    margin-bottom: 20px;
  }
  sup, sub { font-size: 0.7em; }
</style>
</head>

<script type="text/plain" class="qfile" data-id="q1" data-file="q1_sol.py" data-label="Q1">
## Question

Pat, Chris, Blake, and Robin all love dolls. Pat and Chris have some number of
dolls (entered by the user), while the number of dolls Blake and Robin have
follow these rules:

- Blake has two dolls, plus three times as many as Pat.
- Robin has one more doll than whoever of Pat and Chris has the most dolls.

Write a program that gets the number of dolls for Pat and Chris, and then prints
how many dolls each person has, plus the total number of dolls overall.

```
Dolls for Pat: 3 
Dolls for Chris: 5

Pat has 3 dolls. 
Chris has 5 dolls. 
Blake has 11 dolls. 
Robin has 6 dolls.
Total number of dolls: 25
```

## Sample Solution

```python
# get the number of dolls for Pat and Chris
pat_dolls = int(input("Dolls for Pat: "))
chris_dolls = int(input("Dolls for Chris: "))

# calculate the number of dolls for Blake and Robin
blake_dolls = 2 + 3 * pat_dolls
robin_dolls = 1 + max(pat_dolls, chris_dolls)
total_dolls = pat_dolls + chris_dolls + blake_dolls + robin_dolls

# print the number of dolls for each person
print()
print(f"Pat has {pat_dolls} dolls.")
print(f"Chris has {chris_dolls} dolls.")
print(f"Blake has {blake_dolls} dolls.")
print(f"Robin has {robin_dolls} dolls.")
print(f"Total number of dolls: {total_dolls}")
```
</script>

<script type="text/plain" class="qfile" data-id="q2" data-file="q2_sol.py" data-label="Q2">
## Question

Write a program that reads 3 ints from the user, and then prints then in order
from smallest to biggest:

```
1st int: 5
2nd int: 0
3rd int: 2

In order: 0, 2, 5
```

Your program should work for any three integers, and it should only use
features covered so far in the course, like basic arithmetic, printing, etc.
Hint: Research Python's min and max functions.

## Sample Solution

```python
a = int(input('1st int: '))
b = int(input('2nd int: '))
c = int(input('3rd int: '))

first = min(a, b, c)
third = max(a, b, c)

# there are other ways to calculate second, but they are tricky
second = a + b + c - first - third

print(f'In order: {first}, {second}, {third}')
```
</script>

<script type="text/plain" class="qfile" data-id="q3" data-file="q3_sol.py" data-label="Q3">
## Question

Using turtle graphics, draw three equilateral triangles with the
same center: a big one, a medium one inside the big one, and small
one inside the medium. See threeTriangles.gif for example output.

Hint: turtle.up() lifts the turtle pen up so it doesn't draw a line
when it moves. turtle.down() puts it back down.

## Sample Solution

```python
import turtle

# triangle 1
turtle.forward(300)
turtle.left(120)
turtle.forward(300)
turtle.left(120)
turtle.forward(300)
turtle.left(120)

# move turtle to the right and up
turtle.up()
turtle.forward(25)
turtle.left(90)
turtle.forward(25)
turtle.right(90)
turtle.forward(25)
turtle.down()

# triangle 2
turtle.forward(200)
turtle.left(120)
turtle.forward(200)
turtle.left(120)
turtle.forward(200)
turtle.left(120)

# move turtle to the right and up
turtle.up()
turtle.forward(25)
turtle.left(90)
turtle.forward(25)
turtle.right(90)
turtle.forward(25)
turtle.down()

# triangle 3
turtle.forward(100)
turtle.left(120)
turtle.forward(100)
turtle.left(120)
turtle.forward(100)
turtle.left(120)

turtle.done()
```
</script>

<script>
function splitSections(text) {
  text = (text || '').replace(/\r\n/g, '\n');
  const qMatch = text.match(/##\s*Question\s*\n([\s\S]*?)(?=\n##\s*Sample Solution|$)/);
  const sMatch = text.match(/##\s*Sample Solution\s*\n([\s\S]*)/);
  const question = qMatch ? qMatch[1].trim() : text.trim();
  const solution = sMatch ? sMatch[1].trim() : '';
  return { question: question, solution: solution };
}

function loadQuestionsFromPage() {
  const blocks = document.querySelectorAll('script.qfile');
  const loaded = [];
  blocks.forEach(function(block) {
    const sections = splitSections(block.textContent);
    loaded.push({
      id: block.dataset.id,
      file: block.dataset.file,
      label: block.dataset.label,
      question: sections.question,
      solution: sections.solution
    });
  });
  return loaded;
}

const QUESTIONS = loadQuestionsFromPage();

const DONE_KEY = 'presentationAI_done_presentation';
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function saveDone(set) {
  try {
    localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}
let doneSet = loadDone();
let currentId = null;
let answerShown = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInlineMarkup(text) {
  text = text.replace(/\$([^$]+)\$/g, function(_, inner) {
    let out = inner;
    out = out.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
    out = out.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
    return out;
  });
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return text;
}

function renderMarkdownLite(md) {
  md = (md || '').replace(/\r\n/g, '\n').trim();
  if (!md) return '';
  const fenceRegex = /```([a-zA-Z0-9]*)\n([\s\S]*?)```/g;
  const codeBlocks = [];
  const placeholderText = md.replace(fenceRegex, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push(escapeHtml(code.replace(/\n$/, '')));
    return '@@CODEBLOCK' + idx + '@@';
  });
  const blocks = placeholderText.split(/\n\s*\n/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const codeMatch = trimmed.match(/^@@CODEBLOCK(\d+)@@$/);
    if (codeMatch) {
      html += '<pre><code>' + codeBlocks[parseInt(codeMatch[1], 10)] + '</code></pre>';
      continue;
    }
    const lines = trimmed.split('\n');
    if (lines.every(function(l) { return /^\s*-\s+/.test(l); })) {
      html += '<ul>' + lines.map(function(l) {
        return '<li>' + renderInlineMarkup(escapeHtml(l.replace(/^\s*-\s+/, ''))) + '</li>';
      }).join('') + '</ul>';
    } else {
      const joined = trimmed.replace(/\n/g, ' ');
      html += '<p>' + renderInlineMarkup(escapeHtml(joined)) + '</p>';
    }
  }
  return html;
}

function buildNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  QUESTIONS.forEach(function(q) {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (doneSet.has(q.id) ? ' done' : '') + (q.id === currentId ? ' active' : '');
    btn.type = 'button';
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.title = 'Toggle done';
    check.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(q.id);
    });
    const label = document.createElement('span');
    label.textContent = q.label;
    btn.appendChild(check);
    btn.appendChild(label);
    btn.addEventListener('click', function() {
      showQuestion(q.id);
    });
    nav.appendChild(btn);
  });
}

function toggleDone(id) {
  if (doneSet.has(id)) {
    doneSet.delete(id);
  } else {
    doneSet.add(id);
  }
  saveDone(doneSet);
  buildNav();
  if (id === currentId) renderStage();
}

function showQuestion(id) {
  currentId = id;
  answerShown = false;
  buildNav();
  renderStage();
}

function renderStage() {
  const stage = document.getElementById('stage');
  const q = QUESTIONS.find(function(x) { return x.id === currentId; });
  if (!q) {
    stage.innerHTML = '<div class="placeholder">Select a question above to display it.</div>';
    return;
  }
  const isDone = doneSet.has(q.id);
  const hasSolution = q.solution && q.solution.trim().length > 0;
  let html = '';
  html += '<div class="file-tag">' + q.file + '</div>';
  html += '<div class="question-block">' + renderMarkdownLite(q.question) + '</div>';
  html += '<div class="controls">';
  html += '<button type="button" class="action btn-answer' + (answerShown ? ' showing' : '') + '" id="answerToggle">' + (answerShown ? 'Hide Answer' : 'Show Answer') + '</button>';
  html += '<button type="button" class="action btn-done' + (isDone ? ' active' : '') + '" id="doneToggle">' + (isDone ? '✓ Marked Done' : 'Mark as Done') + '</button>';
  html += '</div>';
  html += '<div class="answer-panel' + (answerShown ? ' visible' : '') + '" id="answerPanel">';
  html += '<h2>Sample Solution</h2>';
  html += hasSolution ? renderMarkdownLite(q.solution) : '<p class="no-answer">No sample solution provided for this question.</p>';
  html += '</div>';
  stage.innerHTML = html;

  document.getElementById('answerToggle').addEventListener('click', function() {
    answerShown = !answerShown;
    renderStage();
  });
  document.getElementById('doneToggle').addEventListener('click', function() {
    toggleDone(q.id);
  });
}

if (QUESTIONS.length === 0) {
  document.getElementById('stage').innerHTML = '<div class="placeholder">No question blocks found in this page.</div>';
} else {
  buildNav();
  renderStage();
}
</script>
