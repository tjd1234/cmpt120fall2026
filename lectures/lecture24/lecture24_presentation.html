<script type="text/plain" class="qfile" data-id="q1" data-file="q1_sol.py" data-label="Q1">
## Question

Each box in the window hides a number. The only way to find out what is in a
box is to open it by calling boxes.open_box(i), which returns the number
inside box i. The first box is box 0.

Write a program that finds which box the target number is in using *linear
search*: open the boxes one at a time, starting at box 0, until you find the
target. Then stop opening boxes, highlight the box the target is in, and print
its index.

These functions will help:

- boxes.open_box(i) opens box i and returns the number inside it
- boxes.num_boxes() returns how many boxes there are
- boxes.highlight_box(i) colours box i green

Sample Run (your numbers will be different)

```
Found 64 in box 6
```

When your program is working, run it a few times and watch the "Boxes opened"
counter. What is the smallest it could ever be? What is the largest?

## Sample Solution

```python
import boxes

boxes.setup(10)
boxes.show_title("Linear search")
target = boxes.pick_target_value()   # a number that is in one of the boxes
boxes.show_target(target)
boxes.wait_for_start()

found_index = -1    # -1 means "not found yet"
i = 0
while i < boxes.num_boxes() and found_index == -1:
    value = boxes.open_box(i)
    if value == target:
        found_index = i
    i += 1

boxes.highlight_box(found_index)
print("Found", target, "in box", found_index)

boxes.done()   # keep the window open and show the Restart button

# The smallest the counter could be is 1 (the target is in box 0). The largest
# is 10 (the target is in the last box).
```
</script>

<script type="text/plain" class="qfile" data-id="q2" data-file="q2_sol.py" data-label="Q2">
## Question

What happens if the target is not in any of the boxes?

The numbers hidden in the boxes are always 1 or bigger, so 0 is never in a
box. The program below is the linear search from q1, but with the target
changed to 0. Run it and see what goes wrong.

Fix the program so that it works whether or not the target is in a box:

- if the target is in a box, highlight the box and print its index (as before)
- if the target is not in any box, print a message saying so

Sample Run (target is 0)

```
0 is not in any box
```

Sample Run (target is in a box; your numbers will be different)

```
Found 64 in box 6
```

Test your program both ways: with target = 0, and with
target = boxes.pick_target_value().

How many boxes does linear search open when the target is not there?

## Sample Solution

```python
import boxes

boxes.setup(10)
boxes.show_title("Linear search")
target = 0   # 0 is never in a box
boxes.show_target(target)
boxes.wait_for_start()

found_index = -1    # -1 means "not found yet"
i = 0
while i < boxes.num_boxes() and found_index == -1:
    value = boxes.open_box(i)
    if value == target:
        found_index = i
    i += 1

if found_index == -1:
    print(target, "is not in any box")
else:
    boxes.highlight_box(found_index)
    print("Found", target, "in box", found_index)

boxes.done()   # keep the window open and show the Restart button

# When the target is not there, linear search opens every box (10 here): it
# has to check them all to be sure.
```
</script>

<script type="text/plain" class="qfile" data-id="q3" data-file="q3_sol.py" data-label="Q3">
## Question

There are 100 boxes, and the numbers in them are in *sorted order*, from
smallest (box 0) to largest (box 99).

Write a program that finds which box the target number is in using *binary
search*. The idea of binary search is as follows:

- use two variables, low and high, to keep track of the range of boxes where the
  target could be

- initially, the target could be in any of the 100 boxes, so start with low = 0
  and high = 99

- open the box in the middle of low and high, and check if it contains the
  target; there are three possibilities: 
  
  1. the target is in the box, you're done
  
  2. the target is less than the number in the box, so it must be in a box to
     the left of the middle box; so change high to the box before the middle

  3. the target is greater than the number in the box, so it must be in a box to
     the *right* of the current box, so change low to the box after the current
     box

- if after doing the above, there are still boxes left that the target could be
  in, then repeat the process with the new range of boxes

- if instead there are no boxes left that the target could be in, then the
  target is not in any box. and you are done

Write code that implements the above algorithm. Highlight the box the target is
in and print its index, or print a message if the target is not in any box.

## Sample Solution

```python
import boxes

boxes.setup(100, sorted=True)
boxes.show_title("Binary search")
target = boxes.pick_target_value()   # a number that is in one of the boxes
boxes.show_target(target)
boxes.wait_for_start()

low = 0
high = boxes.num_boxes() - 1
found_index = -1    # -1 means "not found yet"
while low <= high and found_index == -1:
    mid = (low + high) // 2
    value = boxes.open_box(mid)
    if value == target:
        found_index = mid
    elif value < target:
        low = mid + 1     # target must be to the right of box mid
    else:
        high = mid - 1    # target must be to the left of box mid

if found_index == -1:
    print(target, "is not in any box")
else:
    boxes.highlight_box(found_index)
    print("Found", target, "in box", found_index)
    print("Binary search opened", boxes.num_opened(), "boxes")

boxes.done()   # keep the window open and show the Restart button

# With 100 boxes, binary search never opens more than 7 boxes.
```
</script>

<script type="text/plain" class="qfile" data-id="q4" data-file="q4_sol.py" data-label="Q4">
## Question

A race between linear search and binary search!

There are 100 boxes with their numbers in sorted order. Search for the same
target twice:

1. First use linear search (as in q2). When it finishes, save the number of
   boxes it opened in a variable called linear_count.

2. Then wait for the Next button to be clicked (so there is time to look at
   what linear search did), close all the boxes, and use binary search (as
   in q3). When it finishes, save the number of boxes it opened in a variable
   called binary_count.

Finally, print both counts.

These functions will help:

- boxes.num_opened() returns the number of boxes opened so far
- boxes.close_all() closes all the boxes and sets the counter back to 0
- boxes.show_title(title) shows a title at the top of the window
- boxes.wait_for_button("Next") shows a Next button and waits for a click

Sample Run (your numbers will be different)

```
Linear search opened 75 boxes
Binary search opened 4 boxes
```

Run your program a few times. Does binary search always win?

## Sample Solution

```python
import boxes

boxes.setup(100, sorted=True)
boxes.set_speed(10)                  # 100 boxes is a lot, so open them quickly
target = boxes.pick_target_value()   # a number that is in one of the boxes
boxes.show_target(target)

boxes.show_title("Linear search")
boxes.wait_for_start()

# Linear search
found_index = -1    # -1 means "not found yet"
i = 0
while i < boxes.num_boxes() and found_index == -1:
    value = boxes.open_box(i)
    if value == target:
        found_index = i
    i += 1
boxes.highlight_box(found_index)
linear_count = boxes.num_opened()

boxes.wait_for_button("Next")   # pause so the linear search result can be seen
boxes.close_all()
boxes.show_title("Binary search")

# Binary search
low = 0
high = boxes.num_boxes() - 1
found_index = -1
while low <= high and found_index == -1:
    mid = (low + high) // 2
    value = boxes.open_box(mid)
    if value == target:
        found_index = mid
    elif value < target:
        low = mid + 1     # target must be to the right of box mid
    else:
        high = mid - 1    # target must be to the left of box mid
boxes.highlight_box(found_index)
binary_count = boxes.num_opened()

print("Linear search opened", linear_count, "boxes")
print("Binary search opened", binary_count, "boxes")

boxes.done()   # keep the window open and show the Restart button

# Binary search doesn't always win. If the target is in one of the first few
# boxes, linear search finds it in fewer opens. But linear search can need as
# many as 100 opens, while binary search never needs more than 7.
```
</script>

<script>
function splitSections(text) {
  text = (text || '').replace(/\r\n/g, '\n');
  const qMatch = text.match(/##\s*Question\s*\n([\s\S]*?)(?=\n##\s*Sample Solution|$)/);
  const sMatch = text.match(/##\s*Sample Solution\s*\n([\s\S]*)/);
  const question = qMatch ? qMatch[1].trim() : text.trim();
  const solution = sMatch ? sMatch[1].trim() : '';
  return { question: question, solution: solution };
}

function loadQuestionsFromPage() {
  const blocks = document.querySelectorAll('script.qfile');
  const loaded = [];
  blocks.forEach(function(block) {
    const sections = splitSections(block.textContent);
    loaded.push({
      id: block.dataset.id,
      file: block.dataset.file,
      label: block.dataset.label,
      question: sections.question,
      solution: sections.solution
    });
  });
  return loaded;
}

const QUESTIONS = loadQuestionsFromPage();

const DONE_KEY = 'presentationAI_done_lecture24-presentation';
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function saveDone(set) {
  try {
    localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}
let doneSet = loadDone();
let currentId = null;
let answerShown = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderInlineMarkup(text) {
  text = text.replace(/\$([^$]+)\$/g, function(_, inner) {
    let out = inner;
    out = out.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
    out = out.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
    return out;
  });
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return text;
}

function renderMarkdownLite(md) {
  md = (md || '').replace(/\r\n/g, '\n').trim();
  if (!md) return '';
  const fenceRegex = /```[ \t]*([a-zA-Z0-9]*)[ \t]*\n([\s\S]*?)```/g;
  const codeBlocks = [];
  const placeholderText = md.replace(fenceRegex, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push(escapeHtml(code.replace(/\n$/, '')));
    // blank lines around the placeholder so a code block always stands on
    // its own, even if the question has no blank line before or after it
    return '\n\n@@CODEBLOCK' + idx + '@@\n\n';
  });
  const blocks = placeholderText.split(/\n\s*\n/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const codeMatch = trimmed.match(/^@@CODEBLOCK(\d+)@@$/);
    if (codeMatch) {
      html += '<pre><code>' + codeBlocks[parseInt(codeMatch[1], 10)] + '</code></pre>';
      continue;
    }
    const lines = trimmed.split('\n');
    if (/^\s*-\s+/.test(lines[0])) {
      // Group lines into bullet items: a line starting with "- " begins a
      // new item; any other line (e.g. an indented wrapped continuation of
      // the previous item's text) is appended to the current item instead
      // of being mistaken for a non-list paragraph.
      const items = [];
      lines.forEach(function(l) {
        const m = l.match(/^\s*-\s+(.*)/);
        if (m) {
          items.push(m[1]);
        } else if (items.length) {
          items[items.length - 1] += ' ' + l.trim();
        } else {
          items.push(l.trim());
        }
      });
      html += '<ul>' + items.map(function(item) {
        return '<li>' + renderInlineMarkup(escapeHtml(item)) + '</li>';
      }).join('') + '</ul>';
    } else {
      const joined = trimmed.replace(/\n/g, ' ');
      html += '<p>' + renderInlineMarkup(escapeHtml(joined)) + '</p>';
    }
  }
  return html;
}

function buildNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  QUESTIONS.forEach(function(q) {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (doneSet.has(q.id) ? ' done' : '') + (q.id === currentId ? ' active' : '');
    btn.type = 'button';
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.title = 'Toggle done';
    check.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(q.id);
    });
    const label = document.createElement('span');
    label.textContent = q.label;
    btn.appendChild(check);
    btn.appendChild(label);
    btn.addEventListener('click', function() {
      showQuestion(q.id);
    });
    nav.appendChild(btn);
  });
}

function toggleDone(id) {
  if (doneSet.has(id)) {
    doneSet.delete(id);
  } else {
    doneSet.add(id);
  }
  saveDone(doneSet);
  buildNav();
  if (id === currentId) renderStage();
}

function showQuestion(id) {
  currentId = id;
  answerShown = false;
  buildNav();
  renderStage();
}

function renderStage() {
  const stage = document.getElementById('stage');
  const q = QUESTIONS.find(function(x) { return x.id === currentId; });
  if (!q) {
    stage.innerHTML = '<div class="placeholder">Select a question above to display it.</div>';
    return;
  }
  const isDone = doneSet.has(q.id);
  const hasSolution = q.solution && q.solution.trim().length > 0;
  let html = '';
  html += '<div class="file-tag">' + q.file + '</div>';
  html += '<div class="question-block">' + renderMarkdownLite(q.question) + '</div>';
  html += '<div class="controls">';
  html += '<button type="button" class="action btn-answer' + (answerShown ? ' showing' : '') + '" id="answerToggle">' + (answerShown ? 'Hide Answer' : 'Show Answer') + '</button>';
  html += '<button type="button" class="action btn-done' + (isDone ? ' active' : '') + '" id="doneToggle">' + (isDone ? '✓ Marked Done' : 'Mark as Done') + '</button>';
  html += '</div>';
  html += '<div class="answer-panel' + (answerShown ? ' visible' : '') + '" id="answerPanel">';
  html += '<h2>Sample Solution</h2>';
  html += hasSolution ? renderMarkdownLite(q.solution) : '<p class="no-answer">No sample solution provided for this question.</p>';
  html += '</div>';
  stage.innerHTML = html;

  document.getElementById('answerToggle').addEventListener('click', function() {
    answerShown = !answerShown;
    renderStage();
  });
  document.getElementById('doneToggle').addEventListener('click', function() {
    toggleDone(q.id);
  });
}

if (QUESTIONS.length === 0) {
  document.getElementById('stage').innerHTML = '<div class="placeholder">No question blocks found in this page.</div>';
} else {
  buildNav();
  renderStage();
}
</script>
