<style>
  :root {

<script type="text/plain" class="qfile" data-id="q1" data-file="q1_sol.py" data-label="Q1">
## Question

Write a program that copies the file words_shuffled.txt into a new filed named
words_sorted.txt, where the words are sorted in alphabetical order. You can
assume that the file.

Print out how many words are in the file.

## Sample Solution

```python
#
# read the shuffled words into a list
#
shuffled_file = open("words_shuffled.txt", "r")
all_words = []
for word in shuffled_file:
    words = word.strip()
    all_words.append(words)

shuffled_file.close()
print(f'There are {len(all_words)} words in the file.')

#
# sort the words
#
all_words.sort()

#
# write the sorted words to a new file
#
sorted_file = open("words_sorted.txt", "w")
for word in all_words:
    sorted_file.write(word + "\n")
sorted_file.close()
print('Words written to words_sorted.txt')
```
</script>

<script type="text/plain" class="qfile" data-id="q2" data-file="q2_sol.py" data-label="Q2">
## Question

Write a program that tests if a file of words (one word per line) is in
alphabetical order. If the file is not in alphabetical order, have it print out
the first word that is out of order (and then stop). If the file is in
alphabetical order, the program should print out a message saying so.

Test it with these files, which are all in alphabetical order:

- empty.txt is a an empty file
- one_word.txt has one word
- sorted5.txt has 5 words

And these files, which are NOT in alphabetical order:

- unsorted5.txt has 5 words
- words_shuffled.txt has thousands of word

For example, for suppose unsorted5.txt contains this:

```
marshmallow
coffee
hat
vegetables
candy
```

Then the program should print:

```
unsorted5.txt is NOT in sorted order: "coffee" is out of order
```

## Sample Solution

```python
filename = 'unsorted5.txt'
word_file = open(filename, 'r')
prev_word = ''
for line in word_file:
    word = line.strip()
    if word < prev_word:
        print(f'{filename} is NOT in sorted order: "{word}" is out of order')
        break # jumps out of the loop
    prev_word = word
else:
    print(f"{filename} is in alphabetical order")
```
</script>

<script type="text/plain" class="qfile" data-id="q3" data-file="q3_sol.py" data-label="Q3">
## Question

Consider the following program, which calculates the average of a list of quiz
scores minus the lowest score:

```
scores = [4, 8, 6, 2, 10]
lowest = my_min(scores) # 2 is lowest
average = (sum(scores) - lowest) / (len(scores) - 1)
print(average)  # 7.0
```

Write the my_min function: it should return the lowest number on a list of
numbers. Do NOT use Python's built-in min function (calculate it using variables
and a loop).

## Sample Solution

```python
def my_min(lst):
    smallest_so_far = lst[0]
    for num in lst:
        if num < smallest_so_far:
            smallest_so_far = num
    return smallest_so_far

scores = [4, 8, 6, 2, 10]
lowest = my_min(scores) # 2 is lowest
average = (sum(scores) - lowest) / (len(scores) - 1)
print(f'Quiz average: {average}')  # 7.0
```
</script>

<script type="text/plain" class="qfile" data-id="q4" data-file="q4_sol.py" data-label="Q4">
## Question

Write a function called selection_sort(lst) that returns a sorted copy of the
list. Sorted means the following:

- if lst is a list of numbers, then the numbers are arranged from smallest to
  biggest

- if lst is a list of strings, then the strings are arranged in alphabetic order

For example:

```
prices = [2.3, 1.0, 5.5, 10.2, 1.75]
sorted_prices = selection_sort(prices)
print(sorted_prices)  # [1.0, 1.75, 2.3, 5.5, 10.2]

names = ["David", "Charlie", "Alice", "Bob"]
sorted_names = selection_sort(names)
print(sorted_names)  # ['Alice', 'Bob', 'Charlie', 'David']
```

Important: the selection_sort(L) function should NOT modify the list L.

To sort the list L using selection sort, do the following:
- make a new empty list called result
- as long as there are items left in L repeat the following steps:
  - get and remove the smallest element from L
  - append that smallest element to the end of result

## Sample Solution

```python
def selection_sort(lst):
    unsorted = lst[:]  # makes a copy of lst
    result = []
    while len(unsorted) > 0:
        smallest = min(unsorted)
        unsorted.remove(smallest)
        result.append(smallest)
    return result

prices = [2.3, 1.0, 5.5, 10.2, 1.75]
sorted_prices = selection_sort(prices)
print(sorted_prices)  # [1.0, 1.75, 2.3, 5.5, 10.2]

names = ["David", "Charlie", "Alice", "Bob"]
sorted_names = selection_sort(names)
print(sorted_names)  # ['Alice', 'Bob', 'Charlie', 'David']
```
</script>

<script>
function splitSections(text) {
  text = (text || '').replace(/\r\n/g, '\n');
  const qMatch = text.match(/##\s*Question\s*\n([\s\S]*?)(?=\n##\s*Sample Solution|$)/);
  const sMatch = text.match(/##\s*Sample Solution\s*\n([\s\S]*)/);
  const question = qMatch ? qMatch[1].trim() : text.trim();
  const solution = sMatch ? sMatch[1].trim() : '';
  return { question: question, solution: solution };
}

function loadQuestionsFromPage() {
  const blocks = document.querySelectorAll('script.qfile');
  const loaded = [];
  blocks.forEach(function(block) {
    const sections = splitSections(block.textContent);
    loaded.push({
      id: block.dataset.id,
      file: block.dataset.file,
      label: block.dataset.label,
      question: sections.question,
      solution: sections.solution
    });
  });
  return loaded;
}

const QUESTIONS = loadQuestionsFromPage();

// The lecture's intro.md text, if it has one, shown as the opening screen.
const introBlock = document.getElementById('introText');
const INTRO = introBlock ? introBlock.textContent.trim() : '';

const DONE_KEY = 'presentationAI_done_lecture26-presentation';
function loadDone() {
  try {
    return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]'));
  } catch (e) {
    return new Set();
  }
}
function saveDone(set) {
  try {
    localStorage.setItem(DONE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) {}
}
let doneSet = loadDone();
let currentId = null;
let answerShown = false;

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function safeUrl(url) {
  // links and images may only point at files or web pages, not run scripts
  return /^\s*javascript:/i.test(url) ? '#' : url.replace(/"/g, '&quot;');
}

// Inline Markdown (text is already HTML-escaped): `code`, **bold**,
// *italics*, [links](file.py), ![images](picture.png), and $x^2$ / $x_1$.
function renderInlineMarkup(text) {
  // set code spans aside first, so nothing inside them is changed
  const codeSpans = [];
  text = text.replace(/`([^`]+)`/g, function(_, code) {
    codeSpans.push('<code>' + code + '</code>');
    return '\u0000' + (codeSpans.length - 1) + '\u0000';
  });
  text = text.replace(/\$([^$]+)\$/g, function(_, inner) {
    let out = inner;
    out = out.replace(/\^\{([^}]+)\}/g, '<sup>$1</sup>');
    out = out.replace(/\^([A-Za-z0-9])/g, '<sup>$1</sup>');
    out = out.replace(/_\{([^}]+)\}/g, '<sub>$1</sub>');
    out = out.replace(/_([A-Za-z0-9])/g, '<sub>$1</sub>');
    return out;
  });
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function(_, alt, src) {
    return '<img src="' + safeUrl(src) + '" alt="' + alt.replace(/"/g, '&quot;') + '">';
  });
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, label, url) {
    return '<a href="' + safeUrl(url) + '">' + label + '</a>';
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // *italics* only when the stars aren't inside a word, so 2*3*4 is left alone
  text = text.replace(/(^|[^\w*])\*([^*\s](?:[^*]*?[^*\s])?)\*(?![\w*])/g, '$1<em>$2</em>');
  text = text.replace(/\u0000(\d+)\u0000/g, function(_, i) { return codeSpans[i]; });
  return text;
}

// An <img ...> line in the Markdown, rebuilt with only its src, alt, and
// width attributes (so no other HTML gets into the page).
function renderImgTag(attrText) {
  const attrs = {};
  attrText.replace(/(\w+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g, function(_, name, v1, v2) {
    attrs[name.toLowerCase()] = v1 !== undefined ? v1 : v2;
  });
  let tag = '<img src="' + safeUrl(attrs.src || '') + '" alt="' + (attrs.alt || '').replace(/"/g, '&quot;') + '"';
  if (/^\d+(%|px)?$/.test(attrs.width || '')) tag += ' width="' + attrs.width + '"';
  return '<p>' + tag + '></p>';
}

function renderMarkdownLite(md) {
  md = (md || '').replace(/\r\n/g, '\n').trim();
  if (!md) return '';
  const fenceRegex = /```[ \t]*([a-zA-Z0-9]*)[ \t]*\n([\s\S]*?)```/g;
  const codeBlocks = [];
  const placeholderText = md.replace(fenceRegex, function(_, lang, code) {
    const idx = codeBlocks.length;
    codeBlocks.push(escapeHtml(code.replace(/\n$/, '')));
    // blank lines around the placeholder so a code block always stands on
    // its own, even if the question has no blank line before or after it
    return '\n\n@@CODEBLOCK' + idx + '@@\n\n';
  });
  // headings and <img> lines are blocks of their own
  const separated = placeholderText.replace(/^([ \t]*(?:#{1,6}[ \t]+.*|<img\b[^>]*>)[ \t]*)$/gim, '\n\n$1\n\n');
  const blocks = separated.split(/\n\s*\n/);
  let html = '';
  for (const block of blocks) {
    const trimmed = block.trim();
    if (!trimmed) continue;
    const codeMatch = trimmed.match(/^@@CODEBLOCK(\d+)@@$/);
    if (codeMatch) {
      html += '<pre><code>' + codeBlocks[parseInt(codeMatch[1], 10)] + '</code></pre>';
      continue;
    }
    const headingMatch = trimmed.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (headingMatch) {
      const level = headingMatch[1].length;
      html += '<h' + level + ' class="md-heading">' + renderInlineMarkup(escapeHtml(headingMatch[2])) + '</h' + level + '>';
      continue;
    }
    const imgMatch = trimmed.match(/^<img\b([^>]*)>$/i);
    if (imgMatch) {
      html += renderImgTag(imgMatch[1]);
      continue;
    }
    const lines = trimmed.split('\n');
    const listItem = /^\s*([-*]|\d+[.)])\s+(.*)/;
    const first = lines[0].match(listItem);
    if (first) {
      // Group lines into list items: a line starting with "- ", "* ", or
      // "1. " begins a new item; any other line (e.g. an indented wrapped
      // continuation of the previous item's text) is appended to the
      // current item instead of being mistaken for a paragraph.
      const items = [];
      lines.forEach(function(l) {
        const m = l.match(listItem);
        if (m) {
          items.push(m[2]);
        } else if (items.length) {
          items[items.length - 1] += ' ' + l.trim();
        }
      });
      const numbered = /^\d/.test(first[1]);
      const open = numbered ? '<ol start="' + parseInt(first[1], 10) + '">' : '<ul>';
      html += open + items.map(function(item) {
        return '<li>' + renderInlineMarkup(escapeHtml(item)) + '</li>';
      }).join('') + (numbered ? '</ol>' : '</ul>');
    } else {
      const joined = trimmed.replace(/\n/g, ' ');
      html += '<p>' + renderInlineMarkup(escapeHtml(joined)) + '</p>';
    }
  }
  return html;
}

function buildNav() {
  const nav = document.getElementById('questionNav');
  nav.innerHTML = '';
  if (INTRO) {
    const introBtn = document.createElement('button');
    introBtn.className = 'q-btn' + (currentId === null ? ' active' : '');
    introBtn.type = 'button';
    introBtn.textContent = 'Intro';
    introBtn.addEventListener('click', showIntro);
    nav.appendChild(introBtn);
  }
  QUESTIONS.forEach(function(q) {
    const btn = document.createElement('button');
    btn.className = 'q-btn' + (doneSet.has(q.id) ? ' done' : '') + (q.id === currentId ? ' active' : '');
    btn.type = 'button';
    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = '✓';
    check.title = 'Toggle done';
    check.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleDone(q.id);
    });
    const label = document.createElement('span');
    label.textContent = q.label;
    btn.appendChild(check);
    btn.appendChild(label);
    btn.addEventListener('click', function() {
      showQuestion(q.id);
    });
    nav.appendChild(btn);
  });
}

function toggleDone(id) {
  if (doneSet.has(id)) {
    doneSet.delete(id);
  } else {
    doneSet.add(id);
  }
  saveDone(doneSet);
  buildNav();
  if (id === currentId) renderStage();
}

function showIntro() {
  currentId = null;
  answerShown = false;
  buildNav();
  renderStage();
}

function showQuestion(id) {
  currentId = id;
  answerShown = false;
  buildNav();
  renderStage();
}

function renderStage() {
  const stage = document.getElementById('stage');
  const q = QUESTIONS.find(function(x) { return x.id === currentId; });
  if (!q) {
    if (INTRO) {
      stage.innerHTML = '<div class="question-block intro-block">' + renderMarkdownLite(INTRO) + '</div>'
        + '<div class="placeholder intro-start">Press &rarr; or pick a question above to start.</div>';
    } else {
      stage.innerHTML = '<div class="placeholder">Select a question above (or press &rarr;) to display it.</div>';
    }
    return;
  }
  const isDone = doneSet.has(q.id);
  const hasSolution = q.solution && q.solution.trim().length > 0;
  let html = '';
  html += '<div class="file-tag">' + q.file + '</div>';
  html += '<div class="question-block">' + renderMarkdownLite(q.question) + '</div>';
  html += '<div class="controls">';
  if (hasSolution) {
    html += '<button type="button" class="action btn-answer' + (answerShown ? ' showing' : '') + '" id="answerToggle">' + (answerShown ? 'Hide Answer' : 'Show Answer') + '</button>';
  }
  html += '<button type="button" class="action btn-done' + (isDone ? ' active' : '') + '" id="doneToggle">' + (isDone ? '✓ Marked Done' : 'Mark as Done') + '</button>';
  if (!hasSolution) {
    html += '<span class="no-answer no-solution-note">Solution not posted yet.</span>';
  }
  html += '</div>';
  if (hasSolution) {
    html += '<div class="answer-panel' + (answerShown ? ' visible' : '') + '" id="answerPanel">';
    html += '<h2>Sample Solution</h2>';
    html += renderMarkdownLite(q.solution);
    html += '</div>';
  }
  stage.innerHTML = html;

  if (hasSolution) {
    document.getElementById('answerToggle').addEventListener('click', function() {
      answerShown = !answerShown;
      renderStage();
    });
  }
  document.getElementById('doneToggle').addEventListener('click', function() {
    toggleDone(q.id);
  });
}

// Text size. The - and + keys change --text-scale,
// which the question and answer font sizes are multiplied by. The size is
// remembered in this browser, so it stays the same for every lecture.
const SCALE_KEY = 'presentationAI_text_scale';
const MIN_SCALE = 0.5;
const MAX_SCALE = 2.5;
let textScale = 1;
try {
  const saved = parseFloat(localStorage.getItem(SCALE_KEY));
  if (saved >= MIN_SCALE && saved <= MAX_SCALE) textScale = saved;
} catch (e) {}

function setTextScale(scale) {
  textScale = Math.round(Math.min(Math.max(scale, MIN_SCALE), MAX_SCALE) * 10) / 10;
  document.documentElement.style.setProperty('--text-scale', textScale);
  try { localStorage.setItem(SCALE_KEY, String(textScale)); } catch (e) {}
}

setTextScale(textScale);

// Keyboard controls: left/right arrows move between questions, Space shows
// or hides the answer, and - / + change the text size.
function moveQuestion(step) {
  if (QUESTIONS.length === 0) return;
  const i = QUESTIONS.findIndex(function(x) { return x.id === currentId; });
  let next;
  if (INTRO && step < 0 && i <= 0) {
    if (i === 0) showIntro();   // left from the first question goes back to the intro
    return;
  }
  if (i === -1) {
    next = step > 0 ? 0 : QUESTIONS.length - 1;  // nothing shown yet
  } else {
    next = Math.min(Math.max(i + step, 0), QUESTIONS.length - 1);
  }
  if (QUESTIONS[next].id !== currentId) showQuestion(QUESTIONS[next].id);
}

document.addEventListener('keydown', function(e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;  // leave browser shortcuts alone
  if (e.key === 'ArrowRight') {
    moveQuestion(1);
  } else if (e.key === 'ArrowLeft') {
    moveQuestion(-1);
  } else if (e.key === ' ') {
    const shown = QUESTIONS.find(function(x) { return x.id === currentId; });
    if (!shown || !shown.solution) return;   // nothing to show
    answerShown = !answerShown;
    renderStage();
  } else if (e.key === '-' || e.key === '_') {
    setTextScale(textScale - 0.1);
  } else if (e.key === '+' || e.key === '=') {
    setTextScale(textScale + 0.1);
  } else {
    return;
  }
  // stop Space from also scrolling the page or clicking a focused button
  e.preventDefault();
  if (document.activeElement) document.activeElement.blur();
});

if (QUESTIONS.length === 0) {
  document.getElementById('stage').innerHTML = '<div class="placeholder">No question blocks found in this page.</div>';
} else {
  buildNav();
  renderStage();
}
</script>
</body>
